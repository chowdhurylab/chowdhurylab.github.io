name: Deploy static lab website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the complete published website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Read GitHub Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Test the two CatLog entry pages
        run: python3 -B tests/test_sync_catlog_latest.py
      - name: Validate the public CatLog payload and entry pages
        run: python3 -B scripts/check-catlog-publish.py
      # upload-pages-artifact excludes nested dotfiles, including the public
      # method skill. Keep those URLs in the same Pages-compatible artifact.
      - name: Package the complete static website without Jekyll
        run: |
          tar -h -c -f "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .
          python3 -B - "$RUNNER_TEMP/artifact.tar" <<'PY'
          import subprocess
          import sys
          import tarfile

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          expected = {name for name in tracked if name and not name.startswith('.github/')}
          with tarfile.open(sys.argv[1]) as archive:
              members = archive.getmembers()
          if any(not (member.isfile() or member.isdir()) for member in members):
              raise SystemExit('Pages artifact contains a link or unsupported file type')
          actual = {member.name.removeprefix('./') for member in members if member.isfile()}
          if actual != expected:
              raise SystemExit(f'Pages artifact differs from checkout: missing={sorted(expected - actual)}, extra={sorted(actual - expected)}')
          print(f'Pages artifact verified: {len(actual)} tracked files, including public dotfiles')
          PY
      - name: Upload the verified Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated website artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

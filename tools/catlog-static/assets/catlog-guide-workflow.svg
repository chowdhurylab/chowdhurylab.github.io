<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="720" height="392" role="img" aria-labelledby="t d">
  <title id="t">How to use CatLog</title>
  <desc id="d">Search by enzyme, EC number, organism, or substrate. Compare values and conditions, then open a row for sequences, SMILES, and sources. Page and record downloads use JSON; all public data and the table index use compressed JSONL.</desc>
  <defs>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#20312e;font-size:16px}
      .panel{fill:#fff;stroke:#c9d7d3;stroke-width:1.5}
      .head{fill:#edf5f2}
      .title{font-size:18px;font-weight:600}
      .step{fill:#fff;font-weight:600;text-anchor:middle}
      .muted{fill:#52645f}
      .rule{stroke:#dce5e1;stroke-width:1}
      .bar{fill:#d5e2dd}
      .format{text-anchor:end;fill:#1f6f66}
    </style>
  </defs>

  <g transform="translate(1,1)">
    <rect class="panel" width="342" height="178" rx="6"/>
    <path class="head" d="M6 1H336Q341 1 341 6V46H1V6Q1 1 6 1Z"/>
    <circle cx="27" cy="24" r="14" fill="#1f6f66"/>
    <text class="step" x="27" y="30">1</text>
    <text class="title" x="52" y="30">Search</text>
    <rect x="18" y="62" width="306" height="38" rx="4" fill="#fff" stroke="#98ada5"/>
    <text x="30" y="87">hexokinase</text>
    <text class="muted" x="18" y="128">Enzyme, EC number, organism,</text>
    <text class="muted" x="18" y="151">or substrate</text>
  </g>

  <g transform="translate(377,1)">
    <rect class="panel" width="342" height="178" rx="6"/>
    <path class="head" d="M6 1H336Q341 1 341 6V46H1V6Q1 1 6 1Z"/>
    <circle cx="27" cy="24" r="14" fill="#1f6f66"/>
    <text class="step" x="27" y="30">2</text>
    <text class="title" x="52" y="30">Compare</text>
    <text class="muted" x="18" y="76">kcat</text>
    <text class="muted" x="103" y="76">Km</text>
    <text class="muted" x="188" y="76">T</text>
    <text class="muted" x="273" y="76">pH</text>
    <path class="rule" d="M18 85H324M18 116H324"/>
    <rect class="bar" x="18" y="96" width="44" height="8" rx="2"/>
    <rect class="bar" x="103" y="96" width="44" height="8" rx="2"/>
    <rect class="bar" x="188" y="96" width="32" height="8" rx="2"/>
    <rect class="bar" x="273" y="96" width="32" height="8" rx="2"/>
    <text class="muted" x="18" y="151">Read values with their conditions.</text>
  </g>

  <g transform="translate(1,213)">
    <rect class="panel" width="342" height="178" rx="6"/>
    <path class="head" d="M6 1H336Q341 1 341 6V46H1V6Q1 1 6 1Z"/>
    <circle cx="27" cy="24" r="14" fill="#1f6f66"/>
    <text class="step" x="27" y="30">3</text>
    <text class="title" x="52" y="30">Open a row</text>
    <text x="18" y="77">Protein + substrate</text>
    <text class="muted" x="18" y="101">Sequence + SMILES</text>
    <path class="rule" d="M18 114H324"/>
    <text x="18" y="145">Paper + source</text>
  </g>

  <g transform="translate(377,213)">
    <rect class="panel" width="342" height="178" rx="6"/>
    <path class="head" d="M6 1H336Q341 1 341 6V46H1V6Q1 1 6 1Z"/>
    <circle cx="27" cy="24" r="14" fill="#1f6f66"/>
    <text class="step" x="27" y="30">4</text>
    <text class="title" x="52" y="30">Download</text>
    <text x="18" y="78">Page or record</text>
    <text class="format" x="324" y="78">JSON</text>
    <path class="rule" d="M18 91H324"/>
    <text x="18" y="115">All public data</text>
    <text class="format" x="324" y="115">JSONL.gz</text>
    <path class="rule" d="M18 128H324"/>
    <text x="18" y="152">Table index</text>
    <text class="format" x="324" y="152">JSONL.gz</text>
  </g>
</svg>

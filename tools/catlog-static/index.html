<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CatLog has moved to catlog.structf.studio</title>
    <meta name="description" content="CatLog, the enzyme kinetics database, is at https://catlog.structf.studio." />
    <link rel="canonical" href="https://catlog.structf.studio/" />
    <link rel="icon" href="/images/rz.png" />
    <!-- Keep this page at its addresses (tools/catlog-latest.html, tools/catlog-stats.html, tools/catlog-static/):
         the CatRange paper (PNAS Nexus, doi:10.1093/pnasnexus/pgag309, Data availability) cites
         https://chowdhurylab.github.io/tools/catlog-latest.html. Since 2026-10-31 CatLog is only at
         https://catlog.structf.studio; this repository keeps nothing else of it. -->
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; background: #fff; color: #1f2328; font: 1.0625rem/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      main { max-width: 34rem; margin: 18vh auto 0; padding: 0 16px; }
      h1 { margin: 0 0 12px; font-size: 1.6rem; line-height: 1.25; }
      p { margin: 0; }
      a { color: #2f5597; }
      @media (prefers-color-scheme: dark) {
        body { background: #121212; color: #e6e6e6; }
        a { color: #8ab4f8; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CatLog has moved</h1>
      <p>CatLog, the enzyme kinetics database, is now at <a id="catlogLink" href="https://catlog.structf.studio/">catlog.structf.studio</a>.</p>
    </main>
    <script src="/assets/js/usage-tracker.js" data-usage-source="catlog"></script>
    <script>
      (function (link) {
        // an address of the old app opens the same view: Browse with its filters, a record, Stats, the Guide, the Team
        var h = location.hash,
          path = /^#(browse(\?.*)?|record=[^#]+|stats(-[A-Za-z0-9-]+)?|guide(-[A-Za-z0-9-]+)?|team)$/.test(h) ? "/browse" + h
            : /catlog-stats(\.html)?$/.test(location.pathname) ? "/browse#stats" : "/";
        link.href = "https://catlog.structf.studio" + path;
        location.replace(link.href);
      })(document.getElementById("catlogLink"));
    </script>
  </body>
</html>
